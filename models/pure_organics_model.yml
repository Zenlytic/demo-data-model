version: '1'
type: model
name: pure_organics
connection: demo
week_start_day: sunday
access_grants:
  - name: pii_access
    user_attribute: Department
    allowed_values:
      - Executive
      - Finance

relationships:
  - from_table: order_lines
    join_table: order_line_returns
    relationship: one_to_one
    join_type: left_outer
    sql_on: ${order_lines.order_line_id} = ${order_line_returns.order_line_id}
