version: 1
type: view
name: customers_rls_test
description: >-
  ZEN-8837 test view. A copy of customers, limited to the states in the
  cues_all_access user attribute. Delete after testing.
model_name: pure_organics
derived_table:
  sql: >
    SELECT *
    FROM DEMO_PROD.CUSTOMERS
    WHERE WHERE '{{ user_attributes["cues_all_access"] }}' = 0 OR STATE = 'CA'
default_date: first_order
row_label: Customer
identifiers:
  - name: customer_id
    type: primary
    sql: ${customer_id}
fields:
  - name: customer_id
    field_type: dimension
    type: string
    primary_key: true
    sql: ${TABLE}.CUSTOMER_ID
    searchable: false

  - name: first_name
    field_type: dimension
    type: string
    sql: ${TABLE}.FIRST_NAME
    searchable: false

  - name: last_name
    field_type: dimension
    type: string
    sql: ${TABLE}.LAST_NAME
    searchable: false

  - name: city
    field_type: dimension
    type: string
    sql: ${TABLE}.CITY
    searchable: false

  - name: state
    field_type: dimension
    type: string
    sql: ${TABLE}.STATE
    searchable: true

  - name: first_order
    field_type: dimension_group
    type: time
    datatype: timestamp
    timeframes:
      - raw
      - date
      - month
      - year
    sql: ${TABLE}.first_order_at

  - name: count_customers
    field_type: measure
    type: count_distinct
    value_format_name: decimal_0
    sql: ${customer_id}