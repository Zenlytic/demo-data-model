version: 1
type: view
name: marketing_spend
description: A view for marketing spend.
model_name: pure_organics
sql_table_name: DEMO_PROD.MARKETING_SPEND
default_date: spend
row_label: Spend Item
fields:
- name: revenue_from_paid_marketing
  field_type: dimension
  type: number
  hidden: true
  sql: ${TABLE}.revenue_from_paid_marketing
  searchable: false

- name: customers_from_paid_marketing
  field_type: dimension
  type: number
  hidden: true
  sql: ${TABLE}.customers_from_paid_marketing
  searchable: false

- name: gross_profit_from_paid_marketing
  field_type: dimension
  type: number
  hidden: true
  sql: ${TABLE}.gross_profit_from_paid_marketing
  searchable: false

- name: unique_key
  field_type: dimension
  type: string
  hidden: true
  primary_key: true
  description: Represents a unique key for each spend event.
  sql: ${TABLE}.spend_id
  zoe_description: Used to uniquely identify marketing spend events.
  searchable: false

- name: channel
  field_type: dimension
  type: string
  description: The channel of the ad spend
  sql: ${TABLE}.channel
  searchable: true

- name: source
  field_type: dimension
  type: string
  description: The source of the ad spend
  sql: ${TABLE}.source
  searchable: true

- name: campaign
  field_type: dimension
  type: string
  description: The campaign of the ad spend
  sql: ${TABLE}.campaign
  searchable: true

- name: ad_spend
  field_type: dimension
  type: string
  hidden: true
  description: The amount spent
  sql: ${TABLE}.ad_spend
  searchable: false

- name: spend
  field_type: dimension_group
  type: time
  datatype: timestamp
  description: The date of the ad spend
  timeframes:
  - raw
  - date
  - week
  - month
  - quarter
  - year
  - day_of_year
  - week_of_year
  - month_of_year
  sql: ${TABLE}.spend_at

# ── Measures ──────────────────────────────────────────────────────────────

- name: total_ad_spend
  field_type: measure
  type: sum
  label: Total Ad Spend
  description: Total paid marketing spend across all channels.
  sql: ${TABLE}.ad_spend
  value_format_name: usd

- name: roas
  field_type: measure
  type: number
  label: ROAS
  description: Return on Ad Spend = Revenue from paid marketing / Ad Spend.
  sql: SUM(${TABLE}.revenue_from_paid_marketing) / NULLIF(SUM(${TABLE}.ad_spend), 0)
  value_format_name: decimal_2

- name: proas
  field_type: measure
  type: number
  label: PROAS
  description: Profit Return on Ad Spend = Gross Profit from paid marketing / Ad Spend.
  sql: SUM(${TABLE}.gross_profit_from_paid_marketing) / NULLIF(SUM(${TABLE}.ad_spend), 0)
  value_format_name: decimal_2

- name: cac
  field_type: measure
  type: number
  label: CAC
  description: Customer Acquisition Cost = Ad Spend / Customers from paid marketing.
  sql: SUM(${TABLE}.ad_spend) / NULLIF(SUM(${TABLE}.customers_from_paid_marketing), 0)
  value_format_name: usd

